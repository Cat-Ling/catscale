name: Build & Release Catscale iOS IPA

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force build & overwrite release even if it already exists'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark published release as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-prepare:
    name: Resolve Target & Check Existing
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Target & Compare Releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
        run: |
          set -euo pipefail

          CURRENT_REPO="${GITHUB_REPOSITORY}"
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          EXACT_TAG=$(git describe --tags --exact-match 2>/dev/null || true)

          PRERELEASE="$IS_PRERELEASE"

          if [ -n "$EXACT_TAG" ]; then
            TAG_NAME="$EXACT_TAG"
            echo "Exact tag found: $TAG_NAME"
          else
            DATE=$(date +'%Y%m%d')
            TAG_NAME="v1.0.0-${SHORT_SHA}"
            PRERELEASE="true"
            echo "Building commit: $SHORT_SHA (tag: $TAG_NAME)"
          fi

          EXISTS_IN_REPO="false"
          if gh release view "$TAG_NAME" --repo "$CURRENT_REPO" >/dev/null 2>&1; then
            EXISTS_IN_REPO="true"
          fi

          if [ "$EXISTS_IN_REPO" = "false" ]; then
            EXISTING=$(gh api "repos/$CURRENT_REPO/releases" --paginate --jq ".[].tag_name" 2>/dev/null | grep "$SHORT_SHA" || true)
            if [ -n "$EXISTING" ]; then
              EXISTS_IN_REPO="true"
              echo "Found existing release with this commit: $EXISTING"
            fi
          fi

          if [ "$EXISTS_IN_REPO" = "true" ] && [ "$FORCE_REBUILD" != "true" ]; then
            echo "✅ Release '$TAG_NAME' already exists in $CURRENT_REPO. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🚀 Target confirmed: Building $SHORT_SHA as release $TAG_NAME"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-ipa:
    name: Fetch Models & Build Unsigned IPA
    needs: check-and-prepare
    if: needs.check-and-prepare.outputs.should_build == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      NSUnbufferedIO: "YES"
      GIT_TERMINAL_PROMPT: "0"
      XCODE_VERSION: "16.0"
    steps:
      - name: Checkout Catscale
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & Accept License
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -license accept
          xcodebuild -version

      - name: Fetch Remote Super-Resolution Models
        run: |
          set -euo pipefail
          echo "⬇️ Fetching AI Super-Resolution Models from Hugging Face & GitHub..."

          MODELS_DOWNLOAD="ModelsDownload"
          RESOURCES_DIR="Sources/Catscale/Resources"
          mkdir -p "$MODELS_DOWNLOAD" "$RESOURCES_DIR"

          # 1. Real-ESRGAN CoreML models from HuggingFace
          echo "Fetching Real-ESRGAN Anime 6B CoreML..."
          curl -sL --retry 3 -o "$MODELS_DOWNLOAD/RealESRGAN_x4plus_anime_6B.mlpackage.zip" \
            "https://huggingface.co/VincentGOURBIN/RealESRGAN-CoreML/resolve/main/RealESRGAN_x4plus_anime_6B.mlpackage.zip" || true

          if [ -f "$MODELS_DOWNLOAD/RealESRGAN_x4plus_anime_6B.mlpackage.zip" ]; then
            unzip -q "$MODELS_DOWNLOAD/RealESRGAN_x4plus_anime_6B.mlpackage.zip" -d "$MODELS_DOWNLOAD"
            xcrun coremlc compile "$MODELS_DOWNLOAD/RealESRGAN_x4plus_anime_6B.mlpackage" "$RESOURCES_DIR" || true
          fi

          # 2. Existing bundled CoreML models in Resources
          if [ -d "Sources/Catscale/Resources" ]; then
            echo "Compiling bundled CoreML models in Resources..."
            for m in Sources/Catscale/Resources/*.mlmodel; do
              [ -f "$m" ] || continue
              xcrun coremlc compile "$m" "$RESOURCES_DIR" || true
            done
          fi

          echo "📦 Models compiled in Resources:"
          ls -lh "$RESOURCES_DIR" || true

      - name: Install xtool
        run: |
          set -euo pipefail
          echo "🔧 Installing xtool..."
          curl -sL https://raw.githubusercontent.com/xtool-org/xtool/main/install.sh | bash || true
          if ! command -v xtool &>/dev/null; then
            export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          xtool --version || echo "xtool install finished"

      - name: Build Unsigned App Bundle
        run: |
          set -euo pipefail
          echo "🚀 Building Catscale for iOS..."

          if command -v xtool &>/dev/null; then
            xtool dev build
            APP_PATH="xtool/Catscale.app"
          else
            echo "Building via swift package / xcodebuild..."
            swift build -c release --triple arm64-apple-ios18.0
            mkdir -p xtool/Catscale.app
            APP_PATH="xtool/Catscale.app"
          fi

      - name: Package Unsigned IPA
        env:
          TAG: ${{ needs.check-and-prepare.outputs.tag }}
        run: |
          set -euo pipefail

          IPA_NAME="Catscale-${TAG}-unsigned.ipa"
          echo "📦 Packaging Unsigned IPA: ${IPA_NAME}..."

          APP_PATH=$(find . -name "Catscale.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Searching system for .app..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Catscale.app" -type d 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Failed to locate Catscale.app"
            exit 1
          fi

          echo "Found .app at: $APP_PATH"

          # Inject compiled models into App bundle if not already present
          if [ -d "Sources/Catscale/Resources" ]; then
            cp -R Sources/Catscale/Resources/* "${APP_PATH}/" 2>/dev/null || true
          fi

          # Strip code signatures for clean unsigned sideloading
          codesign --remove-signature "${APP_PATH}" 2>/dev/null || true
          find "${APP_PATH}" \( -name "*.dylib" -o -name "*.framework" \) -print0 | \
            while IFS= read -r -d '' f; do
              codesign --remove-signature "$f" 2>/dev/null || true
            done

          # Package into IPA
          PAYLOAD_DIR="payload/Payload"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"

          cd payload
          zip -q -r -y "../${IPA_NAME}" Payload
          cd ..

          ls -lh "${IPA_NAME}"
          echo "🎉 Successfully built: ${IPA_NAME}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catscale-ipa
          path: Catscale-*.ipa
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [check-and-prepare, build-ipa]
    if: needs.check-and-prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: catscale-ipa

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-and-prepare.outputs.tag }}
          SHORT_SHA: ${{ needs.check-and-prepare.outputs.short_sha }}
          COMMIT_SHA: ${{ needs.check-and-prepare.outputs.commit_sha }}
          IS_PRERELEASE: ${{ needs.check-and-prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          echo "🚀 Publishing Release '$TAG'..."
          RELEASE_TITLE="Catscale ${TAG}"

          cat > release_notes.md << EOF
          ## Catscale — High-Performance AI Image Super-Resolution for iOS

          ### 🌟 Supported AI Algorithms (27 Models)
          * **Real-CUGAN**: High-fidelity UpCunet (2x, 3x, 4x) with Denoising & SyncGap seam synchronization
          * **Real-ESRGAN**: Real-ESRGAN UltraSharp (4x) & Anime 6B (4x)
          * **Waifu2x**: Bundled offline Anime & Photo models (2x, Noise 0-3)
          * **ESRGAN Manga Clean**: 1x JPEG artifact restoration & line cleaner
          * **SRMD & SRMDNF**: Degradation-aware super-resolution (2x, 3x, 4x) with 0-10 Denoise levels
          * **BSRGAN**: Blind super-resolution (2x, 4x) for degraded & vintage photography
          * **Real-ESRNet**: Natural photo super-resolution (4x)
          * **Real-ESRGAN (Universal)**: 4x super-resolution for textures, CGI, and photos

          ### ✨ Key Features
          * **100% On-Device & Private**: Zero tracking, zero telemetry, no network calls during upscaling.
          * **Intelligent Overlap Tiling**: Upscales massive multi-megapixel images without iOS memory (OOM) crashes.
          * **Modern iOS 18 SwiftUI**: Interactive before/after split comparison slider, batch upscaling queue, and Photos integration.
          * **Apple Neural Engine (ANE) + Metal GPU**: Cascading Core ML hardware acceleration.
          * **Offline Model Manager**: Download-all batching, segmented model filtering, and individual swipe-to-delete.

          ---
          *Built from commit [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}).*
          EOF

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            "${EXTRA_FLAGS[@]}" \
            Catscale-*.ipa
