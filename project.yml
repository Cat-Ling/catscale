name: Catscale
options:
  bundleIdPrefix: com.catscale
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Catscale:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Catscale
    info:
      path: Catscale-Info.plist
      properties:
        CFBundleDisplayName: Catscale
        CFBundleName: Catscale
        CFBundleExecutable: Catscale
        CFBundleIdentifier: com.catscale.app
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.0.2"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: "Catscale requires access to your photo library to select and upscale images."
        NSPhotoLibraryAddUsageDescription: "Catscale requires permission to save upscaled high-resolution photos to your library."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Catscale.entitlements
    settings:
      base:
        PRODUCT_NAME: Catscale
        PRODUCT_BUNDLE_IDENTIFIER: com.catscale.app
        EXECUTABLE_NAME: Catscale
        MARKETING_VERSION: "0.0.2"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Catscale-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
