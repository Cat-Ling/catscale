name: Catscale
options:
  bundleIdPrefix: com.catscale
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Catscale:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Catscale
    info:
      path: Catscale-Info.plist
    entitlements:
      path: Catscale.entitlements
    settings:
      base:
        PRODUCT_NAME: Catscale
        EXECUTABLE_NAME: Catscale
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Catscale-Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
